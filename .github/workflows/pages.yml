# Web version -> https://user863.github.io/Quadrat/
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14

      - name: Build wasm
        run: sh web/build.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Smoke test (every preset, headless)
        working-directory: web
        run: node smoke.mjs

      - name: Site
        run: |
          mkdir site
          cp web/index.html web/panel.js web/quadrat-worklet.js web/quadrat.wasm site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
